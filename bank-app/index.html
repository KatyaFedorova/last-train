<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Nova Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #c8102e;
    --red-600: #a80d26;
    --red-50: #fdf1f3;
    --red-100: #fbe3e7;
    --ink: #14171a;
    --ink-2: #4a5159;
    --muted: #8b939c;
    --line: #eef0f2;
    --surface: #ffffff;
    --surface-2: #f7f8f9;
    --green: #1a8f4c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--surface-2);
    color: var(--ink);
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; }
  .i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .app {
    position: relative;
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    background: var(--surface);
    padding-bottom: 110px;
    overflow-x: hidden;
  }

  /* Header */
  .top {
    display: flex; align-items: center; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 18px) 20px 0;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--red); color: #fff;
    display: grid; place-items: center;
    font-weight: 600; font-size: 14px; letter-spacing: 0.3px;
  }
  .hello { line-height: 1.25; }
  .hello small { display: block; font-size: 12px; color: var(--muted); }
  .hello strong { font-size: 15px; font-weight: 600; }
  .spacer { flex: 1; }
  .icon-btn {
    position: relative; width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center; color: var(--ink-2);
    background: var(--surface-2);
  }
  .icon-btn .dot {
    position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--red); box-shadow: 0 0 0 2px var(--surface-2);
  }

  /* Balance */
  .balance { text-align: center; margin-top: 34px; }
  .balance .label { font-size: 13px; color: var(--muted); font-weight: 500; }
  .balance .amount {
    margin-top: 6px; font-size: 42px; font-weight: 700; letter-spacing: -1.2px;
    font-variant-numeric: tabular-nums;
  }
  .balance .amount .cur { color: var(--muted); font-weight: 600; margin-left: 6px; }
  .cashback {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--red-50); color: var(--red); font-size: 13px; font-weight: 600;
  }
  .cashback .i { width: 16px; height: 16px; }

  /* Cards carousel */
  .cards {
    margin-top: 24px;
    display: flex; gap: 14px;
    overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 6px 12% 32px;
    margin-bottom: -10px;
    scrollbar-width: none;
  }
  .cards::-webkit-scrollbar { display: none; }
  .card {
    flex: 0 0 76%;
    scroll-snap-align: center;
    aspect-ratio: 1.586;
    border-radius: 18px;
    padding: 18px 20px;
    position: relative; overflow: hidden;
    color: #fff;
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,0.18), transparent 55%),
      linear-gradient(135deg, #d91a3a 0%, var(--red) 45%, var(--red-600) 100%);
    box-shadow: 0 14px 30px -12px rgba(168, 13, 38, 0.55);
    transition: transform 0.3s, opacity 0.3s;
    user-select: none;
    cursor: pointer;
  }
  .card:not(.active) { transform: scale(0.92); opacity: 0.6; }
  .card.light {
    color: var(--ink);
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(200,16,46,0.06), transparent 55%),
      linear-gradient(135deg, #ffffff, #f4f5f7);
    border: 1px solid var(--line);
    box-shadow: 0 14px 30px -14px rgba(20, 23, 26, 0.25);
  }
  .card.dark {
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,0.12), transparent 55%),
      linear-gradient(135deg, #2b2f35, #121417);
    box-shadow: 0 14px 30px -14px rgba(0,0,0,0.5);
  }
  .card .row { display: flex; justify-content: space-between; align-items: center; }
  .card .brand { font-weight: 700; font-size: 17px; letter-spacing: -0.3px; }
  .card .brand span { opacity: 0.6; font-weight: 500; }
  .card .cur { font-size: 12px; font-weight: 600; letter-spacing: 1px; opacity: 0.8; }
  .card .chip {
    margin-top: 18px; width: 38px; height: 28px; border-radius: 6px;
    background: linear-gradient(135deg, #e9d6a2, #c7a95e);
    position: relative;
  }
  .card .chip::after {
    content: ""; position: absolute; inset: 7px 9px;
    border: 1px solid rgba(0,0,0,0.18); border-radius: 3px;
  }
  .card .num {
    position: absolute; left: 20px; bottom: 18px;
    font-size: 15px; font-weight: 500; letter-spacing: 2px; font-variant-numeric: tabular-nums;
  }
  .card .net { position: absolute; right: 20px; bottom: 15px; font-weight: 800; font-style: italic; font-size: 19px; letter-spacing: 0.5px; }

  .dots { display: flex; justify-content: center; gap: 6px; }
  .dots span { width: 6px; height: 6px; border-radius: 3px; background: #d9dde1; transition: all 0.25s; }
  .dots span.on { width: 18px; background: var(--red); }

  /* Actions */
  .actions {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    padding: 24px 16px 0;
  }
  .action { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .action .circle {
    width: 56px; height: 56px; border-radius: 18px;
    background: var(--red-50); color: var(--red);
    display: grid; place-items: center;
    transition: transform 0.15s, background 0.15s;
  }
  .action .circle .i { width: 24px; height: 24px; }
  .action:hover .circle { background: var(--red-100); }
  .action:active .circle { transform: scale(0.94); }
  .action span { font-size: 12px; line-height: 1.3; font-weight: 500; color: var(--ink-2); }

  /* Operations */
  .ops { padding: 28px 20px 0; }
  .ops-head { display: flex; align-items: center; justify-content: space-between; }
  .ops-head h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .see-all { color: var(--red); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 2px; }
  .see-all .i { width: 16px; height: 16px; }
  .day { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin: 18px 0 4px; }
  .op { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .op:last-child { border-bottom: 0; }
  .op .ico {
    width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0;
    display: grid; place-items: center;
    background: var(--surface-2); color: var(--ink-2);
  }
  .op .ico.in { background: #e8f6ee; color: var(--green); }
  .op .main { flex: 1; min-width: 0; }
  .op .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .op .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .op .sum { font-size: 15px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .op .sum.plus { color: var(--green); }

  /* Bottom nav */
  .nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 440px;
    display: flex; justify-content: space-around;
    padding: 8px 6px calc(env(safe-area-inset-bottom) + 10px);
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--muted); font-size: 11px; font-weight: 500; padding: 4px 0;
  }
  .tab.active { color: var(--red); font-weight: 600; }

  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 16px);
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px;
    font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: all 0.25s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<!-- Shared outline icons -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M8 17v-5M13 17V8M18 17v-8"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="m16 3 4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></symbol>
    <symbol id="i-pie" viewBox="0 0 24 24"><path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></symbol>
    <symbol id="i-piggy" viewBox="0 0 24 24"><path d="M19 9.5c-.3-1.5-1.2-2.8-2.5-3.7L17 3c-1.4.1-2.6.8-3.4 1.8A8.5 8.5 0 0 0 12 4.7C7.6 4.7 4 7.6 4 11.3c0 2 1 3.8 2.6 5L7 20h3l.5-1.8c.5.1 1 .1 1.5.1s1 0 1.5-.1L14 20h3l.4-3.7c.9-.7 1.6-1.6 2-2.6H21v-4.2z"/><path d="M8 9.5h.01"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></symbol>
    <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 1 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 2v2M10 2v2M14 2v2"/></symbol>
    <symbol id="i-in" viewBox="0 0 24 24"><path d="M17 7 7 17M16 17H7V8"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 17h14v-5l-2-5H7l-2 5z"/><path d="M5 17v2M19 17v2M5 12h14"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m10 9 5 3-5 3z"/></symbol>
  </defs>
</svg>

<div class="app">

  <header class="top">
    <button class="avatar" aria-label="Профіль">КФ</button>
    <div class="hello"><small>Добрий ранок,</small><strong>Катерина</strong></div>
    <div class="spacer"></div>
    <button class="icon-btn" aria-label="Чат"><svg class="i"><use href="#i-chat"/></svg><span class="dot"></span></button>
    <button class="icon-btn" aria-label="Статистика"><svg class="i"><use href="#i-chart"/></svg></button>
  </header>

  <section class="balance">
    <div class="label" id="label">Баланс картки</div>
    <div class="amount" id="balance"></div>
    <button class="cashback"><svg class="i"><use href="#i-gift"/></svg>Кешбек 233 ₴</button>
  </section>

  <div class="cards" id="cards"></div>
  <div class="dots" id="dots"></div>

  <nav class="actions">
    <button class="action" data-msg="Поповнити картку">
      <div class="circle"><svg class="i"><use href="#i-plus"/></svg></div><span>Поповнити</span>
    </button>
    <button class="action" data-msg="Переказ на картку">
      <div class="circle"><svg class="i"><use href="#i-send"/></svg></div><span>Переказ</span>
    </button>
    <button class="action" data-msg="Платіж за IBAN">
      <div class="circle"><svg class="i"><use href="#i-doc"/></svg></div><span>IBAN</span>
    </button>
    <button class="action" data-msg="Обмін валют">
      <div class="circle"><svg class="i"><use href="#i-swap"/></svg></div><span>Обмін</span>
    </button>
  </nav>

  <section class="ops">
    <div class="ops-head">
      <h2>Операції</h2>
      <button class="see-all">Усі <svg class="i"><use href="#i-chev"/></svg></button>
    </div>
    <div id="ops"></div>
  </section>

  <nav class="nav" id="tabs">
    <button class="tab active"><svg class="i"><use href="#i-card"/></svg>Картки</button>
    <button class="tab"><svg class="i"><use href="#i-pie"/></svg>Кредити</button>
    <button class="tab"><svg class="i"><use href="#i-piggy"/></svg>Накопичення</button>
    <button class="tab"><svg class="i"><use href="#i-bag"/></svg>Маркет</button>
    <button class="tab"><svg class="i"><use href="#i-grid"/></svg>Ще</button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>
  // Demo data — edit freely.
  const cards = [
    { style: "light", currency: "UAH", last4: "8820", network: "VISA", name: "Гривнева" },
    { style: "",      currency: "USD", last4: "5116", network: "VISA", name: "Доларова" },
    { style: "dark",  currency: "EUR", last4: "3047", network: "VISA", name: "Євро" },
  ];
  const balances = { UAH: 48250, USD: 71675, EUR: 2140 };
  const symbols = { UAH: "₴", USD: "$", EUR: "€" };

  const operations = {
    USD: [
      { day: "Сьогодні", name: "Frestive Perenenan", sub: "Продукти · 08:12",     sum: -24, icon: "cart" },
      { day: "Сьогодні", name: "Hilo Donut Seseh",   sub: "Кафе · 07:40",         sum: -4,  icon: "coffee" },
      { day: "Вчора",    name: "Поповнення",          sub: "З картки UAH · 19:05", sum: 500, icon: "in" },
      { day: "Вчора",    name: "Uber",                sub: "Таксі · 18:21",        sum: -12, icon: "car" },
    ],
    UAH: [
      { day: "Сьогодні", name: "Сільпо",   sub: "Продукти · 09:30",  sum: -842, icon: "cart" },
      { day: "Вчора",    name: "Kyivstar", sub: "Мобільний · 12:00", sum: -250, icon: "phone" },
    ],
    EUR: [
      { day: "25 жовтня", name: "Netflix", sub: "Підписки · 10:00", sum: -11, icon: "play" },
    ],
  };

  const fmt = (n) => Math.abs(n).toLocaleString("uk-UA");
  const icon = (id) => `<svg class="i"><use href="#i-${id}"/></svg>`;

  const cardsEl = document.getElementById("cards");
  const dotsEl = document.getElementById("dots");
  cardsEl.innerHTML = cards.map((c) => `
    <div class="card ${c.style}">
      <div class="row"><span class="brand">nova<span>bank</span></span><span class="cur">${c.currency}</span></div>
      <div class="chip"></div>
      <span class="num">•••• ${c.last4}</span>
      <span class="net">${c.network}</span>
    </div>`).join("");
  dotsEl.innerHTML = cards.map(() => "<span></span>").join("");

  function show(i) {
    const c = cards[i];
    [...cardsEl.children].forEach((el, j) => el.classList.toggle("active", j === i));
    [...dotsEl.children].forEach((el, j) => el.classList.toggle("on", j === i));
    document.getElementById("label").textContent = `${c.name} картка`;
    document.getElementById("balance").innerHTML = `${fmt(balances[c.currency])}<span class="cur">${symbols[c.currency]}</span>`;

    let html = "", lastDay = null;
    for (const op of operations[c.currency] || []) {
      if (op.day !== lastDay) { html += `<div class="day">${op.day}</div>`; lastDay = op.day; }
      const plus = op.sum > 0;
      html += `
        <div class="op">
          <div class="ico ${plus ? "in" : ""}">${icon(op.icon)}</div>
          <div class="main"><div class="name">${op.name}</div><div class="sub">${op.sub}</div></div>
          <div class="sum ${plus ? "plus" : ""}">${plus ? "+" : "−"}${fmt(op.sum)} ${symbols[c.currency]}</div>
        </div>`;
    }
    document.getElementById("ops").innerHTML = html;
  }

  // Track which card is centered in the carousel.
  const centerOn = (el, behavior) =>
    cardsEl.scrollTo({ left: el.offsetLeft - (cardsEl.clientWidth - el.offsetWidth) / 2, behavior });
  let current = -1;
  function onScroll() {
    const mid = cardsEl.scrollLeft + cardsEl.clientWidth / 2;
    let best = 0, bestD = Infinity;
    [...cardsEl.children].forEach((el, i) => {
      const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid);
      if (d < bestD) { bestD = d; best = i; }
    });
    if (best !== current) { current = best; show(best); }
  }
  cardsEl.addEventListener("scroll", onScroll, { passive: true });
  [...cardsEl.children].forEach((el) => el.addEventListener("click", () => centerOn(el, "smooth")));

  // Start on the USD card.
  requestAnimationFrame(() => { centerOn(cardsEl.children[1], "instant"); onScroll(); });

  const toast = document.getElementById("toast");
  let t;
  function say(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(t);
    t = setTimeout(() => toast.classList.remove("show"), 1600);
  }
  document.querySelectorAll(".action").forEach(b => b.addEventListener("click", () => say(b.dataset.msg)));
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    say(b.textContent.trim());
  }));
</script>
</body>
</html>
